services:
  wiki:
    image: ghcr.io/requarks/wiki:2
    container_name: void-wiki
    restart: unless-stopped
    environment:
      DB_TYPE: postgres
      DB_HOST: wiki-db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-wikijs}
      DB_PASS: ${DB_PASS:-wiki_secret_password_thor_2026}
      DB_NAME: ${DB_NAME:-wiki}
      PORT: 3000
    ports:
      - "${WIKI_BIND_IP:-127.0.0.1}:${WIKI_PORT:-3005}:3000"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
    depends_on:
      wiki-db:
        condition: service_healthy
    volumes:
      - /thor-server/apps/void_player_wiki/data/wiki:/wiki/data
      - /mnt/whale/07_NOTES_WORKING/void_player_wiki:/wiki/storage
    networks:
      - wiki-net

  wiki-db:
    image: postgres:15-alpine
    container_name: void-wiki-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-wiki}
      POSTGRES_USER: ${DB_USER:-wikijs}
      POSTGRES_PASSWORD: ${DB_PASS:-wiki_secret_password_thor_2026}
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wikijs} -d ${DB_NAME:-wiki}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - /thor-server/apps/void_player_wiki/data/postgres:/var/lib/postgresql/data
    networks:
      - wiki-net

networks:
  wiki-net:
    name: void-wiki-network

